services:
  postgres:
    image: postgres:16-alpine
    container_name: rescuesystem_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: RescueSystem@123456Password
      POSTGRES_DB: RescueSystem
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: rescuesystem_api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=RescueSystem;Username=postgres;Password=RescueSystem@123456Password;
    volumes:
      - aspnetcore_data:/app/data

volumes:
  postgres_data:
    driver: local
  aspnetcore_data:
    driver: local
